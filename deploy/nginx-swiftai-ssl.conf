# STEP 2 config (HTTPS): use after the certificate exists at /etc/letsencrypt/live/swift-ai.in/
# Same layout as the singleqr.in config: HTTP redirects to HTTPS, one HTTPS block per site.
# Install: sudo cp deploy/nginx-swiftai-ssl.conf /etc/nginx/conf.d/swiftai.conf && sudo nginx -t && sudo systemctl reload nginx
# (This REPLACES the HTTP-only file of the same name. Keep /etc/nginx/swiftai-locations.inc.)

# Rate limit for the API (per visitor IP). Defined once, outside the server blocks, on purpose.
limit_req_zone $binary_remote_addr zone=swiftai_api:10m rate=30r/m;

# Redirect HTTP to HTTPS (keeps Let's Encrypt renewals working)
server {
    listen 80;
    server_name swift-ai.in www.swift-ai.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/swiftai;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://swift-ai.in$request_uri;
    }
}

# www -> apex
server {
    listen 443 ssl http2;
    server_name www.swift-ai.in;

    ssl_certificate /etc/letsencrypt/live/swift-ai.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swift-ai.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://swift-ai.in$request_uri;
}

# The website
server {
    listen 443 ssl http2;
    server_name swift-ai.in;

    ssl_certificate /etc/letsencrypt/live/swift-ai.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swift-ai.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/swiftai-locations.inc;
}
