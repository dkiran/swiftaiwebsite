# STEP 1 config (HTTP only): serves the site and lets Let's Encrypt verify the domain.
# Install: sudo cp deploy/swiftai-locations.inc /etc/nginx/swiftai-locations.inc
#          sudo cp deploy/nginx-swiftai.conf /etc/nginx/conf.d/swiftai.conf && sudo nginx -t && sudo systemctl reload nginx
# After the certificate is issued, replace it with deploy/nginx-swiftai-ssl.conf (see docs/deployment.md).
# This does not touch other sites on the server (for example singleqr.in): nginx picks the block by server_name.

# Rate limit for the API (per visitor IP). Defined once, outside the server blocks, on purpose.
limit_req_zone $binary_remote_addr zone=swiftai_api:10m rate=30r/m;

server {
    listen 80;
    server_name swift-ai.in www.swift-ai.in;

    include /etc/nginx/swiftai-locations.inc;
}
