# nginx site config for the Swift AI static site (served from /var/www/swiftai).
# Install: sudo cp deploy/nginx-swiftai.conf /etc/nginx/sites-available/swiftai && sudo ln -s /etc/nginx/sites-available/swiftai /etc/nginx/sites-enabled/swiftai
# Replace swift-ai.in with your real domain if different. Then: sudo certbot --nginx -d swift-ai.in -d www.swift-ai.in
server {
    listen 80;
    listen [::]:80;
    server_name swift-ai.in www.swift-ai.in;

    root /var/www/swiftai;
    index index.html;
    charset utf-8;

    # compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

    # security headers (kept at server level so every response gets them)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # hashed build assets never change: cache for a year
    location /_astro/ {
        expires 1y;
        access_log off;
    }

    # images and fonts: cache for 30 days
    location ~* \.(png|jpg|jpeg|svg|ico|webp|woff2)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # pages are folders with index.html (e.g. /about/ -> /about/index.html)
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
